<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bean-gradient" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#a0522d" />
      <stop offset="60%" stop-color="#8b4513" />
      <stop offset="100%" stop-color="#5a2d0c" />
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="50" rx="30" ry="40" fill="url(#bean-gradient)" transform="rotate(-30 50 50)" style="filter: url(#drop-shadow);" />
  <path d="M 45,35 Q 50,30 55,35" stroke="#f5deb3" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4" transform="rotate(-30 50 50)" />
</svg>
